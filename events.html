<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upcoming events · Sisterhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chelsea+Market&family=Inter:wght@400;500;600&display=swap">
<style>
/* ---------------------------------------------------------------
   Brand tokens: match the Square theme
   --------------------------------------------------------------- */
:root {
  --yellow: #FDF4A2;
  --cream: #FFFBD6;
  --orange: #F56B34;
  --orange-soft: #FBC3A6;
  --plum: #27031C;
  --plum-70: #5E4352;
  --ink-on-orange: #141414;
  --radius-card: 16px;
  /* If you host the licensed KG HAPPY Solid font, add an @font-face for it
     and it will be used automatically; Chelsea Market is the fallback. */
  --font-heading: "KG HAPPY Solid", "Chelsea Market", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: transparent;           /* Square section colour shows through */
  color: var(--plum);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.events {
  max-width: 880px;
  min-width: 300px;          /* below this the Square wrapper scrolls sideways */
  margin: 0 auto;
  padding: 8px 4px 24px;     /* the Square section already provides side padding */
}
.title, .desc, .meta { overflow-wrap: anywhere; }   /* long words or links wrap instead of overflowing */

/* Month heading */
.month {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 28px 0 14px;
  font-family: var(--font-heading);
  font-weight: 400;
  font-size: 28px;
  line-height: 1.1;
  letter-spacing: 0.01em;
}
.month:first-child { margin-top: 4px; }
.month::after {
  content: "";
  flex: 1;
  height: 2px;
  border-radius: 2px;
  background: var(--orange);
  opacity: 0.45;
}

/* Event card */
.card {
  display: grid;
  grid-template-columns: 88px minmax(0, 1fr);
  gap: 20px;
  align-items: start;
  padding: 20px;
  margin-bottom: 14px;
  background: var(--cream);
  border: 1.5px solid rgba(39, 3, 28, 0.12);
  border-radius: var(--radius-card);
  opacity: 0;
  transform: translateY(10px);
  animation: rise 520ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes rise { to { opacity: 1; transform: none; } }

/* Date badge */
.date {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  aspect-ratio: 1;
  border-radius: 14px;
  background: var(--orange);
  color: var(--ink-on-orange);
  text-align: center;
}
.date .mon {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.date .day {
  font-family: var(--font-heading);
  font-size: 38px;
  line-height: 1;
  margin-top: 2px;
}
.date .dow {
  font-size: 12px;
  font-weight: 500;
  margin-top: 4px;
}

.title {
  margin: 0 0 6px;
  font-family: var(--font-heading);
  font-weight: 400;
  font-size: 24px;
  line-height: 1.15;
}
.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  margin: 0 0 10px;
  padding: 0;
  list-style: none;
  font-size: 15px;
  font-weight: 500;
  color: var(--plum-70);
}
.meta li { display: inline-flex; align-items: center; gap: 4px; }
.meta li > span:first-child { display: inline-flex; }   /* icon wrapper: no inline baseline gap */
.meta svg { display: block; flex: none; }
.map-link {
  color: inherit;
  text-decoration: none;
  text-underline-offset: 3px;
  transition: color 150ms ease;
}
.map-link:hover { color: var(--plum); }
.map-link:focus-visible { outline: 3px solid var(--plum); outline-offset: 2px; border-radius: 4px; }
.desc {
  margin: 0 0 14px;
  font-size: 15px;
  white-space: pre-line;
}
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* Buttons: same pill shapes as the Square theme */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 22px;
  border-radius: 100px;
  font: 500 15px/1 var(--font-body);
  letter-spacing: 0.01em;
  text-decoration: none;
  cursor: pointer;
  transition: background-color 150ms ease, transform 150ms ease;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--orange); color: var(--ink-on-orange); border: 0; }
.btn-primary:hover { background: #F58B34; }
.btn-secondary { background: transparent; color: var(--plum); border: 2px solid var(--plum); }
.btn-secondary:hover { background: rgba(39, 3, 28, 0.08); }
.btn:focus-visible { outline: 3px solid var(--plum); outline-offset: 2px; }
.btn .chev { margin-left: 8px; transition: transform 200ms ease; }
.btn[aria-expanded="true"] .chev { transform: rotate(180deg); }

/* "Add to calendar" choices, revealed inline under the buttons */
.addcal {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
  animation: addcal-in 220ms cubic-bezier(0.22, 1, 0.36, 1);
}
.addcal[hidden] { display: none; }
@keyframes addcal-in { from { opacity: 0; transform: translateY(-4px); } }
.btn-option {
  min-height: 40px;
  padding: 0 16px;
  gap: 8px;
  font-size: 14px;
  background: #fff;
  color: var(--plum);
  border: 1.5px solid rgba(39, 3, 28, 0.2);
}
.btn-option:hover { border-color: var(--plum); background: #fff; }
.btn-option svg { flex: none; }

/* Empty / error / loading */
.notice {
  padding: 40px 24px;
  text-align: center;
  background: var(--cream);
  border-radius: var(--radius-card);
  border: 1.5px solid rgba(39, 3, 28, 0.12);
}
.notice-sun {
  display: block;
  width: 72px;
  height: 72px;
  margin: 0 auto;
  animation: sun-spin 40s linear infinite;
}
@keyframes sun-spin { to { transform: rotate(360deg); } }
.actions--center { justify-content: center; margin-top: 20px; }
.notice h2 {
  margin: 12px 0 6px;
  font-family: var(--font-heading);
  font-weight: 400;
  font-size: 26px;
}
.notice p { max-width: 440px; margin: 0 auto; color: var(--plum-70); }

.skeleton {
  height: 128px;
  margin-bottom: 14px;
  border-radius: var(--radius-card);
  background: linear-gradient(90deg, rgba(255,251,214,.6) 0%, rgba(255,251,214,1) 50%, rgba(255,251,214,.6) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.2s linear infinite;
}
@keyframes shimmer { to { background-position: -200% 0; } }

.demo-note {
  margin: 0 0 12px;
  font-size: 13px;
  color: var(--plum-70);
  text-align: center;
}

/* Scrolling inside the Square frame: soft fade hints there's more below */
html.is-scrollable body::after {
  content: "";
  position: sticky;
  bottom: 0;
  display: block;
  height: 40px;
  margin-top: -40px;
  background: linear-gradient(rgba(253, 244, 162, 0), var(--yellow));
  pointer-events: none;
  transition: opacity 200ms ease;
}
html.is-scrolled-end body::after { opacity: 0; }

/* Phones */
@media (max-width: 520px) {
  .events { padding-left: 0; padding-right: 0; }
  .card { grid-template-columns: 56px minmax(0, 1fr); gap: 12px; padding: 14px; }
  .date .day { font-size: 28px; }
  .date .mon { font-size: 11px; }
  .date .dow { display: none; }
  .title { font-size: 20px; }
  .month { font-size: 24px; }
  .btn { flex: 1 1 auto; }
}

@media (prefers-reduced-motion: reduce) {
  .card { animation: none; opacity: 1; transform: none; }
  .skeleton, .notice-sun { animation: none; }
}
</style>
</head>
<body>
<main class="events" id="events" aria-live="polite">
  <div class="skeleton"></div>
  <div class="skeleton"></div>
</main>

<script>
/* ---------------------------------------------------------------
   SETTINGS: paste the published CSV link of the Events sheet
   (File → Share → Publish to web → Events → Comma-separated values)
   --------------------------------------------------------------- */
const CONFIG = {
  SHEET_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vT1dDBQlKTjgRd6wdSOL1qzGX3hH_d_zB_MgnxyjgZsYbilsXPOJyvF9DUaBWKhHNP22WYz4hYgxpeR/pub?gid=1176354909&single=true&output=csv",           // https://docs.google.com/spreadsheets/d/e/…/pub?gid=0&single=true&output=csv
  MAX_EVENTS: 12,              // how many upcoming events to show
  DEFAULT_BUTTON_TEXT: "Learn more",
  TIME_ZONE: "America/New_York",  // shop time zone, so Google Calendar saves the right time
  PARENT_ORIGIN: "*"           // optional: "https://shopsisterhood.square.site" to lock down resize messages
};

/* ---------------------------------------------------------------
   Helpers
   --------------------------------------------------------------- */
const $events = document.getElementById("events");
const params = new URLSearchParams(location.search);
const DEMO = params.has("demo") || !CONFIG.SHEET_CSV_URL;

const ICONS = {
  clock: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  pin: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  chevron: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
  google: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  apple: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>',
  outlook: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  heart: '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#F56B34" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 7.5 2.4C19.5 15.4 12 20 12 20z"/></svg>'
};

function el(tag, attrs = {}, children = []) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") n.textContent = v;
    else if (k === "html") n.innerHTML = v;          // only used with our own static icons
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(children)) if (c) n.appendChild(c);
  return n;
}

function fmt(date, opts) {
  return new Intl.DateTimeFormat("en-US", opts).format(date);
}
const sameDate = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

/* ---------------------------------------------------------------
   Reading the sheet
   --------------------------------------------------------------- */

/* Small CSV parser that handles quoted cells, commas and line breaks */
function parseCSV(text) {
  const rows = []; let row = [], cell = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') inQuotes = false;
      else cell += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

/* Column names are matched loosely, so "Start time", "start time" and "StartTime" all work */
const COLUMN_ALIASES = {
  date: ["date", "startdate", "eventdate"],
  enddate: ["enddate", "lastday", "until"],
  starttime: ["starttime", "time", "from"],
  endtime: ["endtime", "to"],
  title: ["title", "event", "eventname", "name"],
  location: ["location", "where", "place", "venue"],
  address: ["address", "streetaddress", "mapaddress"],
  description: ["description", "details", "about"],
  buttontext: ["buttontext", "button", "buttonlabel"],
  buttonlink: ["buttonlink", "link", "url", "ticketlink"],
  hide: ["hide", "hidden", "draft"]
};
function columnMap(header) {
  const norm = header.map((h) => h.toLowerCase().replace(/[^a-z]/g, ""));
  const map = {};
  for (const [key, names] of Object.entries(COLUMN_ALIASES)) {
    const i = norm.findIndex((h) => names.includes(h));
    if (i !== -1) map[key] = i;
  }
  return map;
}

/* Dates: 11/5/2026, 2026-11-05, Nov 5, 2026 … */
function parseDate(v) {
  v = (v || "").trim();
  if (!v) return null;
  let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m) return new Date(m[3].length === 2 ? 2000 + +m[3] : +m[3], +m[1] - 1, +m[2]);
  const t = Date.parse(v);
  if (isNaN(t)) return null;
  const d = new Date(t);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

/* Times: 6 PM, 6:30pm, 6:00:00 PM, 18:00 … returns [hours, minutes] */
function parseTime(v) {
  v = (v || "").trim().toLowerCase().replace(/\./g, "");
  if (!v) return null;
  const m = v.match(/^(\d{1,2})(?::(\d{2}))?(?::\d{2})?\s*(am|pm|a|p)?$/);
  if (!m) return null;
  let h = +m[1]; const min = +(m[2] || 0); const ap = m[3];
  if (ap && ap.startsWith("p") && h < 12) h += 12;
  if (ap && ap.startsWith("a") && h === 12) h = 0;
  return h > 23 || min > 59 ? null : [h, min];
}

function withTime(day, t) { const d = new Date(day); d.setHours(t[0], t[1], 0, 0); return d; }

function cleanLink(v) {
  v = (v || "").trim();
  if (!v) return null;
  if (!/^https?:\/\//i.test(v)) v = "https://" + v;
  try { return new URL(v).href; } catch (e) { return null; }
}

function rowsToEvents(rows) {
  if (!rows.length) return [];
  const col = columnMap(rows[0]);
  if (params.has("debug")) {
    console.log("[events] header row:", rows[0]);
    console.log("[events] column positions:", col);
    console.table(rows.slice(1).map((r) => ({ title: r[col.title], location: r[col.location], address: r[col.address], cells: r.length })));
  }
  if (col.date === undefined || col.title === undefined) throw new Error('The sheet needs "Date" and "Title" columns.');
  const get = (r, k) => (col[k] === undefined ? "" : (r[col[k]] || "").trim());

  const events = [];
  for (const r of rows.slice(1)) {
    const title = get(r, "title");
    const startDay = parseDate(get(r, "date"));
    if (!title || !startDay) continue;                                     // skip empty or half-filled rows
    if (/^(true|yes|y|x|hide|hidden)$/i.test(get(r, "hide"))) continue;    // drafts

    const endDay = parseDate(get(r, "enddate")) || startDay;
    const st = parseTime(get(r, "starttime"));
    const et = parseTime(get(r, "endtime"));
    const link = cleanLink(get(r, "buttonlink"));

    events.push({
      title,
      location: get(r, "location"),
      address: get(r, "address"),
      description: get(r, "description"),
      allDay: !st,
      start: st ? withTime(startDay, st) : startDay,
      end: st && et ? withTime(endDay, et) : null,
      lastDay: endDay < startDay ? startDay : endDay,
      button: link ? { href: link, text: get(r, "buttontext") || CONFIG.DEFAULT_BUTTON_TEXT } : null
    });
  }

  const today = new Date(); today.setHours(0, 0, 0, 0);
  return events
    .filter((e) => e.lastDay >= today)                     // keep until the end of its last day
    .sort((a, b) => a.start - b.start)
    .slice(0, CONFIG.MAX_EVENTS);
}

/* Accepts the "Publish to web" CSV link, or a normal sheet link shared as "Anyone with the link" */
function csvUrl(u) {
  if (/\/pub\?|output=csv|tqx=out:csv/.test(u)) return u;
  const id = (u.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/) || [])[1];
  const gid = (u.match(/[#&?]gid=(\d+)/) || [])[1];
  if (!id) return u;
  return `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv${gid ? `&gid=${gid}` : ""}`;
}

async function fetchEvents() {
  const url = csvUrl(CONFIG.SHEET_CSV_URL);
  const res = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now());
  if (!res.ok) throw new Error(`Sheet ${res.status}`);
  const text = await res.text();
  if (/^\s*<(!doctype|html)/i.test(text)) throw new Error("The sheet isn't published or shared publicly.");
  return rowsToEvents(parseCSV(text));
}

/* ---------------------------------------------------------------
   Display text
   --------------------------------------------------------------- */
function whenText(ev) {
  const wk = (d) => fmt(d, { weekday: "long" });
  const short = (d) => fmt(d, { weekday: "short", month: "short", day: "numeric" });
  const time = (d) => fmt(d, { hour: "numeric", minute: "2-digit" }).replace(":00", "");
  const multiDay = !sameDate(ev.start, ev.lastDay);

  if (ev.allDay) return multiDay ? `${short(ev.start)} – ${short(ev.lastDay)}` : `${wk(ev.start)} · All day`;
  if (!ev.end) return multiDay ? `${short(ev.start)}, ${time(ev.start)} – ${short(ev.lastDay)}` : `${wk(ev.start)} · ${time(ev.start)}`;
  if (multiDay) return `${short(ev.start)}, ${time(ev.start)} – ${short(ev.end)}, ${time(ev.end)}`;
  let a = time(ev.start); const b = time(ev.end);
  if (a.slice(-2) === b.slice(-2)) a = a.slice(0, -3);   // "6 – 8 PM" instead of "6 PM – 8 PM"
  return `${wk(ev.start)} · ${a} – ${b}`;
}

/* .ics download so visitors can add the event to any calendar app.
   Times are "floating": they mean shop time, as typed in the sheet. */
/* Links that open the event pre-filled in Google Calendar / Outlook.com */
const pad2 = (n) => String(n).padStart(2, "0");
const ymdOf = (d) => `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`;
const dayAfter = (d) => { const x = new Date(d); x.setDate(x.getDate() + 1); return x; };
/* "Location, Address" for calendar apps, so maps work there too */
const placeOf = (ev) => [ev.location, ev.address].filter(Boolean).filter((v, i, a) => i === 0 || !a[0].includes(v)).join(", ");
const mapsUrl = (address) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`;
const endOf = (ev) => ev.end || new Date(ev.start.getTime() + 60 * 60 * 1000);
const detailsOf = (ev) => [ev.description, ev.button ? `${ev.button.text}: ${ev.button.href}` : ""].filter(Boolean).join("\n\n");

function googleUrl(ev) {
  const t = (d) => `${ymdOf(d)}T${pad2(d.getHours())}${pad2(d.getMinutes())}00`;
  const p = new URLSearchParams({
    action: "TEMPLATE",
    text: ev.title,
    dates: ev.allDay ? `${ymdOf(ev.start)}/${ymdOf(dayAfter(ev.lastDay))}` : `${t(ev.start)}/${t(endOf(ev))}`,
    details: detailsOf(ev),
    location: placeOf(ev)
  });
  if (!ev.allDay) p.set("ctz", CONFIG.TIME_ZONE);
  return `https://calendar.google.com/calendar/render?${p}`;
}

function outlookUrl(ev) {
  const iso = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const isoT = (d) => `${iso(d)}T${pad2(d.getHours())}:${pad2(d.getMinutes())}:00`;
  const p = new URLSearchParams({
    path: "/calendar/action/compose",
    rru: "addevent",
    subject: ev.title,
    startdt: ev.allDay ? iso(ev.start) : isoT(ev.start),
    enddt: ev.allDay ? iso(dayAfter(ev.lastDay)) : isoT(endOf(ev)),
    allday: ev.allDay ? "true" : "false",
    body: detailsOf(ev),
    location: placeOf(ev)
  });
  return `https://outlook.live.com/calendar/0/deeplink/compose?${p}`;
}

function downloadIcs(ev) {
  const url = URL.createObjectURL(icsFor(ev));
  const a = el("a", { href: url, download: `${ev.title.replace(/[^\w]+/g, "-").toLowerCase()}.ics` });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function icsFor(ev) {
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  const local = (d) => `${ymd(d)}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const now = new Date();
  const stamp = `${now.getUTCFullYear()}${pad(now.getUTCMonth() + 1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}00Z`;
  const esc = (s) => (s || "").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;");
  let dtStart, dtEnd;
  if (ev.allDay) {
    const after = new Date(ev.lastDay); after.setDate(after.getDate() + 1);
    dtStart = `DTSTART;VALUE=DATE:${ymd(ev.start)}`; dtEnd = `DTEND;VALUE=DATE:${ymd(after)}`;
  } else {
    const end = ev.end || new Date(ev.start.getTime() + 60 * 60 * 1000);
    dtStart = `DTSTART:${local(ev.start)}`; dtEnd = `DTEND:${local(end)}`;
  }
  const lines = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Sisterhood//Events//EN", "BEGIN:VEVENT",
    `UID:${ymd(ev.start)}-${ev.title.replace(/[^\w]+/g, "-").toLowerCase()}@shopsisterhood`,
    `DTSTAMP:${stamp}`, dtStart, dtEnd,
    `SUMMARY:${esc(ev.title)}`,
    placeOf(ev) ? `LOCATION:${esc(placeOf(ev))}` : "",
    ev.description ? `DESCRIPTION:${esc(ev.description)}` : "",
    ev.button ? `URL:${ev.button.href}` : "",
    "END:VEVENT", "END:VCALENDAR"
  ].filter(Boolean);
  return new Blob([lines.join("\r\n")], { type: "text/calendar" });
}

/* ---------------------------------------------------------------
   Rendering
   --------------------------------------------------------------- */
function renderCard(ev, index) {
  const badge = el("div", { class: "date", "aria-hidden": "true" }, [
    el("span", { class: "mon", text: fmt(ev.start, { month: "short" }) }),
    el("span", { class: "day", text: fmt(ev.start, { day: "numeric" }) }),
    el("span", { class: "dow", text: fmt(ev.start, { weekday: "short" }) })
  ]);

  const meta = el("ul", { class: "meta" }, [
    el("li", {}, [el("span", { html: ICONS.clock }), el("span", { text: whenText(ev) })]),
    (ev.location || ev.address) ? el("li", {}, [
      el("span", { html: ICONS.pin }),
      ev.address
        ? el("a", { class: "map-link", href: mapsUrl(ev.address), target: "_blank", rel: "noopener", title: `Open ${ev.address} in Google Maps`, text: ev.location || ev.address })
        : el("span", { text: ev.location })
    ]) : null
  ]);

  const actions = el("div", { class: "actions" });
  if (ev.button) actions.appendChild(el("a", { class: "btn btn-primary", href: ev.button.href, target: "_blank", rel: "noopener", text: ev.button.text }));
  const menuId = `addcal-${index}`;
  const toggle = el("button", { class: "btn btn-secondary", type: "button", "aria-expanded": "false", "aria-controls": menuId }, [
    el("span", { text: "Add to calendar" }),
    el("span", { class: "chev", html: ICONS.chevron })
  ]);
  actions.appendChild(toggle);

  const menu = el("div", { class: "addcal", id: menuId, hidden: "" }, [
    el("a", { class: "btn btn-option", href: googleUrl(ev), target: "_blank", rel: "noopener" }, [el("span", { html: ICONS.google }), el("span", { text: "Google Calendar" })]),
    (() => {
      const b = el("button", { class: "btn btn-option", type: "button" }, [el("span", { html: ICONS.apple }), el("span", { text: "Apple / iCal" })]);
      b.addEventListener("click", () => downloadIcs(ev));
      return b;
    })(),
    el("a", { class: "btn btn-option", href: outlookUrl(ev), target: "_blank", rel: "noopener" }, [el("span", { html: ICONS.outlook }), el("span", { text: "Outlook" })])
  ]);

  toggle.addEventListener("click", () => {
    const open = toggle.getAttribute("aria-expanded") !== "true";
    document.querySelectorAll('.btn[aria-expanded="true"]').forEach((t) => {   // close any other open card
      if (t !== toggle) { t.setAttribute("aria-expanded", "false"); document.getElementById(t.getAttribute("aria-controls")).hidden = true; }
    });
    toggle.setAttribute("aria-expanded", String(open));
    menu.hidden = !open;
  });

  const body = el("div", {}, [
    el("h3", { class: "title", text: ev.title }),
    meta,
    ev.description ? el("p", { class: "desc", text: ev.description }) : null,
    actions,
    menu
  ]);

  const card = el("article", { class: "card" }, [badge, body]);
  card.style.animationDelay = `${Math.min(index, 8) * 70}ms`;
  return card;
}

function render(items) {
  $events.replaceChildren();
  if (DEMO && params.get("demo") !== "empty") $events.appendChild(el("p", { class: "demo-note", text: "Preview with sample events. Add the published sheet link to show real ones." }));

  if (!items.length) {
    $events.appendChild(el("div", { class: "notice" }, [
      el("img", { class: "notice-sun", src: "sun-orange.png", alt: "", width: "72", height: "72" }),
      el("h2", { text: "New events coming soon" }),
      el("p", { text: "We are already dreaming up what's next. Follow along on Instagram to be the first to hear about it!" }),
      el("div", { class: "actions actions--center" }, [
        el("a", { class: "btn btn-primary", href: "https://www.instagram.com/shopsisterhood/", target: "_blank", rel: "noopener", text: "Follow @shopsisterhood" })
      ])
    ]));
    return;
  }

  let currentMonth = "";
  items.forEach((ev, i) => {
    const m = fmt(ev.start, { month: "long", year: "numeric" });
    if (m !== currentMonth) {
      currentMonth = m;
      const sameYear = ev.start.getFullYear() === new Date().getFullYear();
      $events.appendChild(el("h2", { class: "month", text: sameYear ? m.replace(/ \d{4}$/, "") : m }));
    }
    $events.appendChild(renderCard(ev, i));
  });
}

function renderError() {
  $events.replaceChildren(el("div", { class: "notice" }, [
    el("div", { html: ICONS.heart }),
    el("h2", { text: "Events are taking a little nap" }),
    el("p", { text: "We couldn't load the calendar just now. Please try again in a moment." })
  ]));
}

/* Sample rows, written exactly as they'd be typed into the sheet */
function demoEvents() {
  const day = (offset) => { const d = new Date(); d.setDate(d.getDate() + offset); return `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}`; };
  return rowsToEvents([
    ["Date", "End date", "Start time", "End time", "Title", "Description", "Location", "Address", "Button text", "Button link", "Hide"],
    [day(5), "", "6:00 PM", "8:00 PM", "Mommy & Me Fall Styling Night", "Bring your girl for an evening of outfit styling, sweet treats and 15% off fall arrivals.", "Sisterhood Boutique", "123 Main St, Anytown, NY", "Get tickets", "shopsisterhood.square.site/s/shop", ""],
    [day(12), "", "10:30 AM", "12:00 PM", "Little Makers Craft Morning", "A cozy morning of crafts and cocoa for girls ages 4–10. Moms, grab a coffee and browse!", "Sisterhood Boutique", "", "", "", ""],
    [day(26), day(27), "", "", "Holiday Pop-Up Market", "Two days of local makers, holiday gifts and Sisterhood exclusives.", "Community Center", "", "RSVP", "https://www.eventbrite.com/", ""],
    [day(40), "", "", "", "Secret draft event", "This row is hidden", "", "", "", "", "TRUE"]
  ]);
}

/* ---------------------------------------------------------------
   Auto-height: tell the Square page how tall this frame should be
   --------------------------------------------------------------- */
function postHeight() {
  const h = Math.ceil(document.documentElement.scrollHeight);
  if (window.parent !== window) window.parent.postMessage({ type: "sh-events-height", height: h }, CONFIG.PARENT_ORIGIN);
}
function updateScrollHint() {
  const root = document.documentElement;
  root.classList.toggle("is-scrollable", root.scrollHeight > window.innerHeight + 2);
  root.classList.toggle("is-scrolled-end", window.innerHeight + window.scrollY >= root.scrollHeight - 4);
}
new ResizeObserver(() => { postHeight(); updateScrollHint(); }).observe(document.documentElement);
window.addEventListener("scroll", updateScrollHint, { passive: true });
window.addEventListener("resize", updateScrollHint);
window.addEventListener("load", postHeight);

(async function init() {
  try {
    render(DEMO ? (params.get("demo") === "empty" ? [] : demoEvents()) : await fetchEvents());
  } catch (err) {
    console.error(err);
    renderError();
  }
  postHeight();
})();
</script>
